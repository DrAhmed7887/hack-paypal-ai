<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      /* Same chip as the walkthrough captions (scripts/video/cut_frames.py caption_html). */
      :root {
        --ground: #0e2623;
        --chip: rgba(14, 38, 35, 0.93);
        --accent: #3fb9a6;
        --label-ink: #7fd1c4;
        --ink: #ffffff;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--ground); }
      #root { position: relative; width: 100%; height: 100%; font-family: "Inter", sans-serif; }
      #shot { position: absolute; inset: 0; width: 1920px; height: 1080px; object-fit: cover; }
      #chip-host { position: absolute; inset: 0; }
      #chip {
        position: absolute; left: 48px; bottom: 48px; max-width: 1060px;
        padding: 24px 34px 26px; background: var(--chip);
        border-radius: 16px; border-left: 6px solid var(--accent);
      }
      #chip-label {
        font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 28px;
        letter-spacing: 0.12em; text-transform: uppercase; color: var(--label-ink);
      }
      #chip-title { font-weight: 800; font-size: 56px; line-height: 1.08; color: var(--ink); margin-top: 6px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080"
         data-composition-variables='[{"id":"label","type":"string","label":"Chip label","default":"BillCheck"},{"id":"title","type":"string","label":"Title","default":"Who checks the hospital bill?"},{"id":"shot","type":"string","label":"Opening shot","default":"assets/flow_shot.mp4"}]'>
      <video id="shot" class="clip" src="assets/flow_shot.mp4" muted
             data-start="0" data-duration="6" data-media-start="0" data-track-index="0"
             data-var-src="shot"></video>
      <div id="chip-host" class="clip" data-start="0" data-duration="6" data-track-index="1" data-track-kind="graphics">
        <div id="chip">
          <div id="chip-label" data-var-text="label">BillCheck</div>
          <div id="chip-title" data-var-text="title">Who checks the hospital bill?</div>
        </div>
      </div>
    </div>
    <script>
      // Director plan (11 Nov): title fully on at frame 0, hold to 5.0 s, exit 0.4 s fade + 12 px drop.
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#chip", { opacity: 1, y: 0 }, { opacity: 0, y: 12, duration: 0.4, ease: "power2.in" }, 5.0);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
