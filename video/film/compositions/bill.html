    (function () {
      const tl = gsap.timeline({ paused: true });
      const cam = (cx, cy, s) => ({ x: 960 - cx * s, y: 540 - cy * s, scale: s });
      const world = "#bill-world";
      const C0 = cam(1560, 1585, 3.0); // hook: TOTAL CHARGES $4,445.00
      const C1 = cam(1280, 1455, 1.3); // the five lines
      const C2 = cam(1280, 720, 0.75); // the whole BillCheck page
      const C3 = cam(1280, 1080, 0.75); // the sample chip and the bill box

      // Start states
      gsap.set(world, { transformOrigin: "0 0", ...C0, opacity: 1, filter: "blur(0px)" });
      gsap.set("#bill-mark", { scaleX: 0, transformOrigin: "0% 50%" });
      gsap.set("#bill-box .band", { opacity: 0 });
      gsap.set("#bill-slot-head", { opacity: 0 });
      gsap.set("#bill-box .slot", { opacity: 0, scaleX: 0.2, transformOrigin: "0% 50%" });
      gsap.set(".row", { opacity: 0 });
      gsap.set("#bill-label span", { opacity: 0 });
      gsap.set("#root .chk", { opacity: 0, scale: 0.6, transformOrigin: "0% 50%" });
      gsap.set("#bill-m1, #bill-m2", { opacity: 0 });
      gsap.set("#bill-scrim", { opacity: 0 });

      // 1 Hook: one marker sweep under the total as the voice says it
      tl.to("#bill-mark", { scaleX: 1, duration: 0.55, ease: "power2.out" }, 0.35);

      // 2 Tension: pull back to the five lines, then the empty "price to compare" column
      tl.to(world, { ...C1, duration: 0.8, ease: "power2.inOut" }, 3.4);
      tl.to("#bill-box .band", { opacity: 1, duration: 0.18, stagger: 0.08, ease: "power2.out" }, 3.6);
      tl.to("#bill-slot-head", { opacity: 1, duration: 0.25, ease: "power2.out" }, 5.2);
      tl.to("#bill-box .slot", { opacity: 1, scaleX: 1, duration: 0.4, stagger: 0.08, ease: "expo.out" }, 5.3);
      tl.to("#bill-box .slot, #bill-slot-head, #bill-box .band, #bill-mark", { opacity: 0, duration: 0.25, ease: "power2.in" }, 7.9);

      // 3 Reveal: pull back to the real BillCheck page, then down to the bill box
      tl.to(world, { ...C2, duration: 0.9, ease: "power2.inOut" }, 8.5);
      tl.to(world, { ...C3, duration: 0.9, ease: "power2.inOut" }, 10.45);

      // 4 AI reads: the five lines lift out of the box and grow into line rows
      const lineTop = (i) => (1262 + 22 + i * 39.4 - 1080) * 0.75 + 540;
      const sc = 0.47;
      for (let k = 0; k < 5; k++) {
        const rowTop = 190 + k * 146;
        const sx = 462 - 160 - 40 * sc;
        const sy = lineTop(3 + k) - rowTop - 22 * sc;
        tl.fromTo(
          "#bill-r" + (k + 1),
          { x: sx, y: sy, scale: sc, opacity: 0, transformOrigin: "0 0" },
          { x: 0, y: 0, scale: 1, opacity: 1, duration: 0.7, ease: "expo.out" },
          11.85 + k * 0.06,
        );
        tl.to("#bill-l" + (3 + k), { opacity: 0, duration: 0.12, ease: "power2.in" }, 11.83 + k * 0.06);
      }
      // the page recedes behind a ground-coloured scrim so the rows are clearly in front
      tl.to(world, { ...cam(1280, 1080, 0.68), filter: "blur(15px)", duration: 0.5, ease: "power2.in" }, 11.85);
      tl.fromTo("#bill-scrim", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 11.85);
      tl.set(world, { opacity: 0 }, 12.4);
      tl.to("#bill-label span", { opacity: 1, duration: 0.13, stagger: 0.067, ease: "power2.out" }, 12.15);

      // Code check: every code and amount found in the bill text

      // 5 Price: unpriceable rows step back, Medicare values land on ED and CT

      tl.fromTo(
        "#bill-m1, #bill-m2",
        { opacity: 0, filter: "blur(8px)" },
        { opacity: 1, filter: "blur(0px)", duration: 0.2, stagger: 0.12, ease: "power4.out" },
        20.4,
      );
      tl.to("#bill-label span", { opacity: 0, duration: 0.2, ease: "power2.in" }, 21.1);
