      function buildWheel(el) {
        const from = el.dataset.from;

        el.textContent = "";
        el.setAttribute("data-layout-allow-overflow", "");
        for (let i = 0; i < to.length; i++) {

          col.setAttribute("data-layout-ignore", "");

            d.textContent = String((fb + j) % 10);
            strip.appendChild(d);
          }
          strip.dataset.n = String(n);
          col.appendChild(strip);
          el.appendChild(col);
