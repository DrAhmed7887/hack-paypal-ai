[project]
name = "hack-paypal-ai"
version = "0.1.0"
description = "BillCheck: AI medical bill auditor with PayPal sandbox settlement & dispute invoicing"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
    "requests>=2.31.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "pypdf>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "httpx>=0.27"]
video = ["playwright>=1.48"]  # demo-film captures (scripts/video); then: python -m playwright install chromium

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/billcheck"]

[tool.pytest.ini_options]
testpaths = ["tests"]
